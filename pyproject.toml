[project]
name = "pyres-lib"
version = "0.1.0"
description = "PyRES: A Python library for reverberation enhancement system development and simulation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

authors = [
    { name = "Gian Marco De Bortoli", email = "gian.debortoli@aalto.fi" },
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Audio",
    "Intended Audience :: Developers",
]

dependencies = [
    "flamo>=0.1.2",
    "pyFDN>=0.1.0",
    "torch>=2.7",
    "torchaudio>=2.7",
    "numpy>=2.2",
    "pyfar>=0.7",
    "pyrato>=0.4",
    "matplotlib>=3.10",
    "soundfile>=0.13",
]

[build-system]
requires = [
    "setuptools>=69",
    "wheel",
]
build-backend = "setuptools.build_meta"
