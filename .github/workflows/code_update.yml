name: Test PyRES update

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  test-code_update:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      # Create virtual environment and install dependencies
      - name: Create virtual environment
        shell: bash -l {0}
        run: |
          brew install libsndfile
          python -m venv pyres-env
          pyres-env/bin/pip --upgrade pip
          pyres-env/bin/pip install -r requirements.txt

      # Run test code
      - name: Run test example (MacOS/Linux - pip)
        shell: bash -l {0}
        run: |
          pyres-env/bin/python tests/T1_virtual-room.py
          pyres-env/bin/python tests/T2_physical-room.py
          pyres-env/bin/python tests/T3_res.py
          pyres-env/bin/python tests/T4_training.py